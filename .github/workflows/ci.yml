name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (workspace, all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Each integration must compile on its own, not only alongside the others.
      - name: Clippy (each feature alone)
        run: |
          for features in "" serde sqlx-postgres postgres tokio; do
            echo "::group::features: ${features:-none}"
            cargo clippy -p typedflake --all-targets --features "$features" -- -D warnings
            echo "::endgroup::"
          done

      - name: Documentation
        run: cargo doc -p typedflake -p typedflake-macros --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Compile-fail expectations are pinned to the MSRV's diagnostics.
          - rust: "1.99"
            skip_ui: ""
          - rust: stable
            skip_ui: "1"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TYPEDFLAKE_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      TYPEDFLAKE_SKIP_UI: ${{ matrix.skip_ui }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}

      - name: Run tests (all features)
        run: cargo test --workspace --all-targets --all-features

      - name: Run tests (no features)
        run: cargo test -p typedflake --all-targets

      - name: Run doctests
        run: cargo test --workspace --doc --all-features

      - name: Build examples
        run: cargo build --workspace --examples --all-features
