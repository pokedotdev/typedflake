[workspace]
resolver = "3"
members = ["typedflake", "typedflake-macros", "tests/renamed-dependency", "examples/axum-sqlx"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["pokedotdev <hi@poke.dev>"]
repository = "https://github.com/pokedotdev/typedflake"
homepage = "https://github.com/pokedotdev/typedflake"

[workspace.dependencies]
typedflake = { path = "typedflake", version = "0.1.3" }
typedflake-macros = { path = "typedflake-macros", version = "=0.1.3" }
serde = { version = "1.0", default-features = false, features = ["std"] }
sqlx = { version = "0.8", default-features = false }
postgres-types = "0.2"
tokio = { version = "1", default-features = false }
proc-macro2 = "1"
proc-macro-crate = "3"
quote = "1"
syn = { version = "2", features = ["full"] }
criterion = { version = "0.7", features = ["html_reports"] }
proptest = "1"
serde_json = "1.0"
trybuild = "1"
