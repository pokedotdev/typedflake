[package]
name = "typedflake-macros"
description = "Procedural macros for TypedFlake ID declarations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
proc-macro-crate.workspace = true
quote.workspace = true
syn.workspace = true

# Marker features: they select which integration code the macros emit.
[features]
default = []
serde = []
sqlx-postgres = []
postgres = []
tokio = []
